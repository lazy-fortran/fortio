name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  downstream:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install consumer dependencies
        run: |
          read -r -a packages <<< "$(python3 ci/test_downstreams.py --packages)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Run ordinary consumer test suite
        run: python3 ci/test_downstreams.py

  gfortran:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install compiler and independent format oracles
        run: sudo apt-get update && sudo apt-get install -y gfortran netcdf-bin python3-h5py hdf5-tools
      - uses: fortran-lang/setup-fpm@a03b5f81f16417c937a31b745eeb866c5a26a7a0 # v10
      - name: Build
        run: fpm build
      - name: Test
        run: fpm test

  cmake:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install compiler and independent format oracles
        run: sudo apt-get update && sudo apt-get install -y gfortran netcdf-bin python3-h5py hdf5-tools
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel "${SCI_CPUS:-8}"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: cmake --install build --prefix "$RUNNER_TEMP/fortio"
      - name: Verify installed package
        run: |
          cmake -S examples/cmake-consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fortio"
          cmake --build consumer-build --parallel "${SCI_CPUS:-8}"

  native-performance:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install compiler and native comparison libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y gfortran libnetcdff-dev libhdf5-dev python3
      - name: Build native comparisons
        run: >
          cmake -S . -B build-benchmark -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DFORTIO_BUILD_BENCHMARKS=ON
      - run: cmake --build build-benchmark --parallel "${SCI_CPUS:-8}"
      - name: Enforce NetCDF performance
        run: |
          python3 benchmark/compare.py \
            build-benchmark/benchmark_fortio_netcdf \
            build-benchmark/benchmark_native_netcdf --enforce
      - name: Enforce SIMPLE compressed NetCDF-4 performance
        run: |
          python3 benchmark/compare.py \
            build-benchmark/benchmark_fortio_netcdf4_deflate \
            build-benchmark/benchmark_native_netcdf4_deflate --enforce
      - name: Enforce thread-safe compressed throughput
        run: |
          python3 benchmark/compare_threaded.py \
            build-benchmark/benchmark_fortio_netcdf4_threaded --enforce
      - name: Enforce HDF5 performance
        run: |
          python3 benchmark/compare.py \
            build-benchmark/benchmark_fortio_hdf5 \
            build-benchmark/benchmark_native_hdf5 --enforce
      - name: Enforce KAMEL append performance
        run: |
          python3 benchmark/compare.py \
            build-benchmark/benchmark_fortio_hdf5_append \
            build-benchmark/benchmark_native_hdf5_append --enforce

  thread-sanitizer:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install compiler and independent format oracles
        run: >
          sudo apt-get update &&
          sudo apt-get install -y gfortran netcdf-bin python3-h5py
      - name: Configure ThreadSanitizer
        run: >
          cmake -S . -B build-tsan -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_Fortran_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - run: cmake --build build-tsan --parallel "${SCI_CPUS:-8}"
      - name: Test concurrent OpenMP I/O
        run: >
          OMP_NUM_THREADS=8 ctest --test-dir build-tsan
          -R "^(thread_safety|concurrent_hdf5_writes|concurrent_netcdf4_writes)$"
          --output-on-failure

  windows:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GNU Fortran
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Test platform backend
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -R "^(checksum|bytes|platform_io)$"

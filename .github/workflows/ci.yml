name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gfortran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and independent format oracles
        run: sudo apt-get update && sudo apt-get install -y gfortran netcdf-bin python3-h5py hdf5-tools
      - uses: fortran-lang/setup-fpm@v7
      - name: Build
        run: fpm build
      - name: Test
        run: fpm test

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and independent format oracles
        run: sudo apt-get update && sudo apt-get install -y gfortran netcdf-bin python3-h5py hdf5-tools
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: cmake --install build --prefix "$RUNNER_TEMP/fortio"
      - name: Verify installed package
        run: |
          cmake -S examples/cmake-consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fortio"
          cmake --build consumer-build --parallel

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel
      - name: Test platform backend
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -R "^(checksum|bytes|platform_io)$"

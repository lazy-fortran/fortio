# Test direct consumers against a Fortio pull request before it is merged.
# The registry is ci/downstreams. Delegated consumers are owned by libneo's
# reverse-dependency gate and are recorded there without pretending that this
# workflow can inject a Fortio candidate through an indirect dependency.

name: downstream-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      fortio_ref:
        description: Fortio commit or ref to test (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: downstream-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-registry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate downstream registry
        run: python3 ci/check_downstreams.py

  gate:
    needs: validate-registry
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dispatch direct downstreams and wait for their verdicts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          CANDIDATE: ${{ inputs.fortio_ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_BOT_TOKEN is required for downstream-gate" >&2
            exit 1
          fi

          latest_dispatch_id() {
            gh run list -R "$1" --workflow "$2" --event workflow_dispatch \
              --limit 1 --json databaseId -q '.[0].databaseId // empty'
          }

          await_run() {
            local repo=$1 run_id=$2 deadline=$((SECONDS + 5400)) state
            while [ "$SECONDS" -lt "$deadline" ]; do
              state=$(gh run view "$run_id" -R "$repo" --json status,conclusion \
                -q '"\(.status) \(.conclusion)"')
              case "$state" in
                "completed success") return 0 ;;
                "completed "*) echo "downstream $repo: $state" >&2; return 1 ;;
              esac
              sleep 30
            done
            echo "downstream $repo did not finish within 90 minutes" >&2
            return 1
          }

          while read -r repo workflow mode input blocking full; do
            [ "$mode" = direct ] || continue
            echo "dispatching $repo ($workflow, blocking=$blocking, full=$full)"
            before=$(latest_dispatch_id "$repo" "$workflow")
            gh workflow run "$workflow" -R "$repo" --ref main \
              -f "$input=$CANDIDATE"
            run_id=""
            for _ in $(seq 1 24); do
              sleep 5
              run_id=$(latest_dispatch_id "$repo" "$workflow")
              [ -n "$run_id" ] && [ "$run_id" != "$before" ] && break
            done
            if [ -z "$run_id" ] || [ "$run_id" = "$before" ]; then
              echo "could not find dispatched run for $repo" >&2
              [ "$blocking" = yes ] && exit 1
              continue
            fi
            if ! await_run "$repo" "$run_id"; then
              [ "$blocking" = yes ] && exit 1
            fi
          done < <(grep -vE '^[[:space:]]*#|^[[:space:]]*$' ci/downstreams)
